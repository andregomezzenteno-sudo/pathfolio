<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Isotipo de PathFolio: un anillo con un hueco, la misma técnica de
    stroke-dasharray que usa el donut real del dashboard (renderDonut en
    app.js), con el mismo filtro sketchWobbleChart — no es una copia de una
    imagen generada por IA, es el mismo lenguaje de trazo que el resto del
    sitio.
  -->
  <filter id="mark-wobble" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="5.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <circle cx="50" cy="50" r="35.5" fill="none" stroke="#c65d35" stroke-width="15.5"
    stroke-linecap="butt" stroke-dasharray="199.49 23.54" stroke-dashoffset="-11.77"
    transform="rotate(-90 50 50)" filter="url(#mark-wobble)"/>
</svg>
